openapi: 3.1.0
info:
  title: PFM SaaS Admin & User Profile API (US-12, US-13)
  version: 1.0.0
  description: >
    Contratos REST para o Painel SaaS Admin (US-12) e Central de Perfil,
    Família & Controles do Usuário (US-13).
    Isolamento Zero-Trust e Row-Level Security (RLS) obrigatório por tenant_id.
servers:
  - url: https://api.pfm.internal
    description: Production API Gateway
  - url: http://localhost:18080
    description: Local Envoy Gateway

paths:
  /api/v1/admin/tenants:
    get:
      summary: Listar tenants cadastrados
      description: Requer role PLATFORM_ADMIN. Retorna lista paginada de tenants e quotas.
      security:
        - BearerAuth: []
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: page_token
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [TRIAL, ACTIVE, PAST_DUE, SUSPENDED]
        - name: plan
          in: query
          schema:
            type: string
            enum: [FREE, INDIVIDUAL_PRO, FAMILY_PLUS]
      responses:
        '200':
          description: Lista de tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenantsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/tenants/{tenant_id}/plan:
    put:
      summary: Alterar plano de assinatura do tenant
      security:
        - BearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_plan]
              properties:
                new_plan:
                  type: string
                  enum: [FREE, INDIVIDUAL_PRO, FAMILY_PLUS]
      responses:
        '200':
          description: Plano alterado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummary'

  /api/v1/admin/tenants/{tenant_id}/status:
    put:
      summary: Atualizar status da assinatura do tenant
      security:
        - BearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_status]
              properties:
                new_status:
                  type: string
                  enum: [TRIAL, ACTIVE, PAST_DUE, SUSPENDED]
                reason:
                  type: string
      responses:
        '200':
          description: Status atualizado com sucesso

  /api/v1/admin/metrics:
    get:
      summary: Obter métricas operacionais agregadas da plataforma
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas agregadas da plataforma
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMetrics'

  /api/v1/profile:
    get:
      summary: Obter perfil do usuário autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: Atualizar perfil do usuário
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /api/v1/profile/members:
    get:
      summary: Listar membros da conta familiar
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de membros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyMember'
    post:
      summary: Convidar novo membro familiar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role]
              properties:
                email:
                  type: string
                  format: email
                full_name:
                  type: string
                role:
                  type: string
                  enum: [OWNER, MEMBER, VIEWER]
                spending_allowance:
                  type: string
                  example: "2000.0000"
      responses:
        '201':
          description: Convite enviado com sucesso

  /api/v1/profile/members/{member_id}:
    delete:
      summary: Remover membro da conta familiar
      security:
        - BearerAuth: []
      parameters:
        - name: member_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Membro removido com sucesso

  /api/v1/profile/budgets:
    get:
      summary: Obter tetos de orçamento por categoria
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tetos de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryBudget'
    post:
      summary: Definir teto de orçamento por categoria
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryBudget'
      responses:
        '200':
          description: Teto configurado com sucesso

  /api/v1/profile/cards/{card_id}/pdf-password:
    post:
      summary: Armazenar senha cifrada via KMS para desbloqueio de fatura PDF
      security:
        - BearerAuth: []
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Senha cifrada e armazenada no cofre KMS

  /api/v1/profile/export:
    post:
      summary: Solicitar exportação completa de dados sob a LGPD
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [JSON, CSV]
                  default: JSON
      responses:
        '202':
          description: Exportação agendada

  /api/v1/profile/crypto-shred:
    post:
      summary: Solicitar exclusão criptográfica definitiva (Crypto-Shredding LGPD)
      description: Destrói a Data Encryption Key (DEK) no KMS tornando os dados permanentemente irrecuperáveis.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation_phrase, mfa_token]
              properties:
                confirmation_phrase:
                  type: string
                  example: "EXCLUIR_DEFINITIVAMENTE_MINHA_CONTA"
                mfa_token:
                  type: string
      responses:
        '200':
          description: Chaves KMS destruídas e conta expurgada

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Não autenticado
    Forbidden:
      description: Acesso negado por falta de permissão ou violação de RLS

  schemas:
    TenantSummary:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
          enum: [FREE, INDIVIDUAL_PRO, FAMILY_PLUS]
        status:
          type: string
          enum: [TRIAL, ACTIVE, PAST_DUE, SUSPENDED]
        max_members:
          type: integer
        max_cards:
          type: integer
        monthly_pdf_quota:
          type: integer
        used_pdf_quota:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListTenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
        next_page_token:
          type: string
        total_count:
          type: integer

    PlatformMetrics:
      type: object
      properties:
        total_tenants:
          type: integer
        active_tenants:
          type: integer
        trial_tenants:
          type: integer
        past_due_tenants:
          type: integer
        suspended_tenants:
          type: integer
        total_transactions_processed:
          type: integer
          format: int64
        total_ai_tokens_consumed:
          type: integer
          format: int64
        total_pdf_statements_imported:
          type: integer
          format: int64
        generated_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [OWNER, MEMBER, VIEWER]
        spending_allowance:
          type: string
          example: "2500.0000"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FamilyMember:
      type: object
      properties:
        member_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [OWNER, MEMBER, VIEWER]
        spending_allowance:
          type: string
        status:
          type: string
          enum: [INVITED, ACTIVE, REMOVED]
        invited_at:
          type: string
          format: date-time
        joined_at:
          type: string
          format: date-time

    CategoryBudget:
      type: object
      required: [category_id, category_name, monthly_cap]
      properties:
        category_id:
          type: string
        category_name:
          type: string
        monthly_cap:
          type: string
          example: "800.0000"
        alert_threshold_percentage:
          type: integer
          default: 80
