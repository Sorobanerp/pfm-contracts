syntax = "proto3";

package pfm.v1;

option go_package = "github.com/sorobanerp/pfm-contracts/gen/go/pfm/v1;pfmv1";
option java_multiple_files = true;
option java_outer_classname = "UserProfileServiceProto";
option java_package = "com.sorobanerp.pfm.v1";

// ============================================================================
// User Profile Service (US-13 — Central de Perfil, Família & Controles do Usuário)
// Gestão de perfil, membros familiares (RBAC), tetos por categoria,
// cofre de senhas de PDF via KMS, exportação LGPD e Crypto-Shredding.
// ============================================================================

enum FamilyRole {
  FAMILY_ROLE_UNSPECIFIED = 0;
  FAMILY_ROLE_OWNER = 1;
  FAMILY_ROLE_MEMBER = 2;
  FAMILY_ROLE_VIEWER = 3;
}

message UserProfile {
  string user_id = 1;
  string tenant_id = 2;
  string full_name = 3;
  string email = 4;
  FamilyRole role = 5;
  string spending_allowance = 6;
  string created_at = 7;
  string updated_at = 8;
}

message GetUserProfileRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
}

message UpdateUserProfileRequest {
  string tenant_id = 1;
  string user_id = 2;
  string full_name = 3;
}

message UpdateUserProfileResponse {
  UserProfile profile = 1;
}

message FamilyMember {
  string member_id = 1;
  string tenant_id = 2;
  string email = 3;
  string full_name = 4;
  FamilyRole role = 5;
  string spending_allowance = 6;
  string status = 7;
  string invited_at = 8;
  string joined_at = 9;
}

message ListFamilyMembersRequest {
  string tenant_id = 1;
}

message ListFamilyMembersResponse {
  repeated FamilyMember members = 1;
}

message InviteFamilyMemberRequest {
  string tenant_id = 1;
  string email = 2;
  string full_name = 3;
  FamilyRole role = 4;
  string spending_allowance = 5;
}

message InviteFamilyMemberResponse {
  FamilyMember member = 1;
  string invitation_token = 2;
  string expires_at = 3;
}

message RemoveFamilyMemberRequest {
  string tenant_id = 1;
  string member_id = 2;
}

message RemoveFamilyMemberResponse {
  string tenant_id = 1;
  string member_id = 2;
  bool removed = 3;
}

message CategoryBudget {
  string category_id = 1;
  string category_name = 2;
  string monthly_cap = 3;
  int32 alert_threshold_percentage = 4;
}

message GetCategoryBudgetsRequest {
  string tenant_id = 1;
}

message GetCategoryBudgetsResponse {
  repeated CategoryBudget budgets = 1;
}

message SetCategoryBudgetRequest {
  string tenant_id = 1;
  string category_id = 2;
  string category_name = 3;
  string monthly_cap = 4;
  int32 alert_threshold_percentage = 5;
}

message SetCategoryBudgetResponse {
  CategoryBudget budget = 1;
}

message SetCardPdfPasswordRequest {
  string tenant_id = 1;
  string card_id = 2;
  string password = 3;
}

message SetCardPdfPasswordResponse {
  string tenant_id = 1;
  string card_id = 2;
  bool stored = 3;
  string key_id = 4;
}

message ExportUserDataRequest {
  string tenant_id = 1;
  string user_id = 2;
  string format = 3;
}

message ExportUserDataResponse {
  string tenant_id = 1;
  string export_id = 2;
  string download_url = 3;
  string expires_at = 4;
  string checksum_sha256 = 5;
}

message RequestCryptoShreddingRequest {
  string tenant_id = 1;
  string user_id = 2;
  string confirmation_phrase = 3;
  string mfa_token = 4;
}

message RequestCryptoShreddingResponse {
  string tenant_id = 1;
  string request_id = 2;
  string status = 3;
  string destroyed_key_id = 4;
  string shredded_at = 5;
}

service UserProfileService {
  // Retrieves user profile within the tenant.
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);

  // Updates user profile information.
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);

  // Lists all members within a tenant's family account.
  rpc ListFamilyMembers(ListFamilyMembersRequest) returns (ListFamilyMembersResponse);

  // Invites a new family member with a specified role (OWNER, MEMBER, VIEWER).
  rpc InviteFamilyMember(InviteFamilyMemberRequest) returns (InviteFamilyMemberResponse);

  // Removes a member from the tenant's family account.
  rpc RemoveFamilyMember(RemoveFamilyMemberRequest) returns (RemoveFamilyMemberResponse);

  // Retrieves category budget caps and alert thresholds.
  rpc GetCategoryBudgets(GetCategoryBudgetsRequest) returns (GetCategoryBudgetsResponse);

  // Sets or updates a category budget cap.
  rpc SetCategoryBudget(SetCategoryBudgetRequest) returns (SetCategoryBudgetResponse);

  // Stores an encrypted PDF statement password for automated unlocking via KMS.
  rpc SetCardPdfPassword(SetCardPdfPasswordRequest) returns (SetCardPdfPasswordResponse);

  // Generates a complete data export under LGPD.
  rpc ExportUserData(ExportUserDataRequest) returns (ExportUserDataResponse);

  // Executes cryptographic deletion (Crypto-Shredding) of tenant's KMS DEK.
  rpc RequestCryptoShredding(RequestCryptoShreddingRequest) returns (RequestCryptoShreddingResponse);
}
